# Local development only. Production runs on Cloud Run + Cloud SQL (see README).
# Every port is bound to 127.0.0.1 on purpose: Docker writes its own iptables rules
# that bypass ufw, so a bare "5432:5432" publishes the database to the whole internet.

services:
  postgres:
    image: postgres:15-alpine
    container_name: skillswap_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: skillswap
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Adminer — browse the dev database at http://localhost:8081
  adminer:
    image: adminer:latest
    container_name: skillswap_adminer
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: skillswap_redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
